<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Management System</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Sarabun -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      font-family: 'Sarabun', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <!-- PDF View Mode Container -->
  <div id="pdfViewerContainer" class="hidden fixed inset-0 bg-slate-900 z-50 flex flex-col">
    <div class="bg-slate-800 text-white p-4 flex justify-between items-center shadow-md">
      <h1 class="text-lg font-semibold"><i class="fa-regular fa-file-pdf text-red-400 mr-2"></i>ระบบแสดงผล Portfolio</h1>
      <button onclick="closeViewer()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg transition text-sm">
        <i class="fa-solid fa-arrow-left mr-2"></i>กลับหน้าหลัก
      </button>
    </div>
    <iframe id="pdfFrame" class="w-full h-full border-none" src=""></iframe>
  </div>

  <!-- Main App View -->
  <div id="mainContainer" class="container mx-auto px-4 py-8 max-w-5xl">
    
    <!-- Top Bar Navigation (Admin Status) -->
    <div class="flex justify-end mb-4">
      <div id="adminNav">
        <button onclick="openAdminLoginModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2">
          <i class="fa-solid fa-user-shield text-slate-600"></i>
          เข้าสู่ระบบแอดมิน
        </button>
      </div>
    </div>

    <!-- Header Section -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 mb-8 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-800">
          <i class="fa-solid fa-folder-open text-indigo-600 mr-2"></i> Portfolio Storage System
        </h1>
        <p class="text-slate-500 text-sm mt-1">จัดการและอัปโหลดไฟล์ผลงาน Portfolio (.pdf)</p>
      </div>
      
      <div>
        <input type="file" id="fileInput" accept="application/pdf" class="hidden" onchange="handleFileSelect(event)">
        <button onclick="document.getElementById('fileInput').click()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl shadow-md hover:shadow-lg transition duration-200 font-medium flex items-center justify-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
          เพิ่มไฟล์ .PDF
        </button>
      </div>
    </div>

    <!-- Data Table Section -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="p-4 sm:p-6 border-b border-slate-100 flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-800">รายการไฟล์ทั้งหมด</h2>
        <button onclick="loadFilesList()" class="text-indigo-600 hover:text-indigo-800 text-sm font-medium flex items-center gap-1">
          <i class="fa-solid fa-rotate-right"></i> รีเฟรชข้อมูล
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-100 text-slate-600 text-sm font-semibold">
              <th class="py-4 px-6">ชื่อไฟล์ Portfolio</th>
              <th class="py-4 px-6">ขนาดไฟล์</th>
              <th class="py-4 px-6">วันที่อัปโหลด</th>
              <th class="py-4 px-6 text-center">จัดการ</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100 text-sm">
            <tr>
              <td colspan="4" class="text-center py-8 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                <p>กำลังโหลดข้อมูล...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwg0vi1g8Ke6CvRjd2CoAOoIeCUsgr_h8w4dlMeMexi7ZqrP2wJMDq9VAJeK1_hOpFo/exec";

    // ตัวแปรเก็บสถานะ Admin
    let adminAuth = JSON.parse(sessionStorage.getItem('adminAuth')) || null;

    window.onload = function() {
      updateAdminUI();
      const urlParams = new URLSearchParams(window.location.search);
      const fileId = urlParams.get('id');

      if (fileId) {
        showPdfViewer(fileId);
      } else {
        loadFilesList();
      }
    };

    function updateAdminUI() {
      const adminNav = document.getElementById('adminNav');
      if (adminAuth) {
        adminNav.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="bg-emerald-100 text-emerald-800 text-xs px-3 py-1.5 rounded-lg font-medium">
              <i class="fa-solid fa-user-check mr-1"></i> แอดมิน: ${adminAuth.username}
            </span>
            <button onclick="logoutAdmin()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-1.5 rounded-lg text-xs font-medium transition">
              <i class="fa-solid fa-right-from-bracket mr-1"></i> ออกจากระบบ
            </button>
          </div>
        `;
      } else {
        adminNav.innerHTML = `
          <button onclick="openAdminLoginModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2">
            <i class="fa-solid fa-user-shield text-slate-600"></i>
            เข้าสู่ระบบแอดมิน
          </button>
        `;
      }
    }

    // Modal เข้าสู่ระบบแอดมินด้วย SweetAlert2
    async function openAdminLoginModal() {
      const { value: formValues } = await Swal.fire({
        title: 'เข้าสู่ระบบแอดมิน',
        html: `
          <div class="text-left mt-4 space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Username</label>
              <input id="swal-input-user" class="swal2-input !m-0 !w-full !rounded-xl !text-sm" placeholder="ระบุ Username">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
              <input id="swal-input-pass" type="password" class="swal2-input !m-0 !w-full !rounded-xl !text-sm" placeholder="ระบุ Password">
            </div>
          </div>
        `,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'เข้าสู่ระบบ',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#4F46E5',
        customClass: { popup: 'rounded-2xl' },
        preConfirm: () => {
          const username = document.getElementById('swal-input-user').value;
          const password = document.getElementById('swal-input-pass').value;
          if (!username || !password) {
            Swal.showValidationMessage('กรุณากรอกข้อมูลให้ครบถ้วน');
            return false;
          }
          return { username, password };
        }
      });

      if (formValues) {
        Swal.fire({
          title: 'กำลังตรวจสอบ...',
          allowOutsideClick: false,
          customClass: { popup: 'rounded-2xl' },
          didOpen: () => Swal.showLoading()
        });

        try {
          const response = await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'loginAdmin',
              username: formValues.username,
              password: formValues.password
            })
          });

          const result = await response.json();

          if (result.status === 'success') {
            adminAuth = { username: formValues.username, password: formValues.password };
            sessionStorage.setItem('adminAuth', JSON.stringify(adminAuth));
            updateAdminUI();
            
            Swal.fire({
              icon: 'success',
              title: 'เข้าสู่ระบบสำเร็จ',
              text: 'ยินดีต้อนรับเข้าสู่ระบบจัดการแอดมิน',
              timer: 1500,
              showConfirmButton: false,
              customClass: { popup: 'rounded-2xl' }
            });

            loadFilesList();
          } else {
            Swal.fire({
              icon: 'error',
              title: 'เข้าสู่ระบบไม่สำเร็จ',
              text: result.message,
              customClass: { popup: 'rounded-2xl' }
            });
          }
        } catch (err) {
          Swal.fire({
            icon: 'error',
            title: 'เกิดข้อผิดพลาด',
            text: 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้',
            customClass: { popup: 'rounded-2xl' }
          });
        }
      }
    }

    function logoutAdmin() {
      adminAuth = null;
      sessionStorage.removeItem('adminAuth');
      updateAdminUI();
      Swal.fire({
        icon: 'info',
        title: 'ออกจากระบบแล้ว',
        timer: 1500,
        showConfirmButton: false,
        customClass: { popup: 'rounded-2xl' }
      });
      loadFilesList();
    }

    function showPdfViewer(id) {
      document.getElementById('mainContainer').classList.add('hidden');
      const pdfContainer = document.getElementById('pdfViewerContainer');
      const iframe = document.getElementById('pdfFrame');
      
      iframe.src = `https://drive.google.com/file/d/${id}/preview`;
      pdfContainer.classList.remove('hidden');
    }

    function closeViewer() {
      const url = new URL(window.location.href);
      url.searchParams.delete('id');
      window.history.pushState({}, '', url);
      
      document.getElementById('pdfViewerContainer').classList.add('hidden');
      document.getElementById('mainContainer').classList.remove('hidden');
      loadFilesList();
    }

    async function loadFilesList() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = `
        <tr>
          <td colspan="4" class="text-center py-8 text-slate-400">
            <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
            <p>กำลังโหลดข้อมูล...</p>
          </td>
        </tr>`;

      try {
        const response = await fetch(`${GAS_WEB_APP_URL}?action=getFiles`);
        const result = await response.json();

        if (result.status === 'success' && result.data.length > 0) {
          tbody.innerHTML = result.data.map(file => {
            const deleteBtnHtml = adminAuth ? `
              <button onclick="deleteFile('${file.id}', '${file.name}')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-1.5 rounded-lg text-xs font-medium transition ml-1">
                <i class="fa-solid fa-trash-can mr-1"></i> ลบ
              </button>
            ` : '';

            return `
              <tr class="hover:bg-slate-50 transition">
                <td class="py-4 px-6 font-medium text-indigo-600 hover:text-indigo-800 cursor-pointer" onclick="openFileUrl('${file.id}')">
                  <i class="fa-regular fa-file-pdf text-red-500 mr-2 text-base"></i>${file.name}
                </td>
                <td class="py-4 px-6 text-slate-500">${file.size}</td>
                <td class="py-4 px-6 text-slate-500">${file.date}</td>
                <td class="py-4 px-6 text-center">
                  <button onclick="openFileUrl('${file.id}')" class="bg-slate-100 hover:bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-lg text-xs font-medium transition">
                    <i class="fa-solid fa-eye mr-1"></i> เปิดดู
                  </button>
                  ${deleteBtnHtml}
                </td>
              </tr>
            `;
          }).join('');
        } else {
          tbody.innerHTML = `
            <tr>
              <td colspan="4" class="text-center py-8 text-slate-400">
                <i class="fa-solid fa-folder-open text-3xl mb-2"></i>
                <p>ยังไม่มีไฟล์ผลงานในระบบ</p>
              </td>
            </tr>`;
        }
      } catch (err) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="text-center py-8 text-red-500">
              <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
              <p>เกิดข้อผิดพลาดในการโหลดข้อมูล</p>
            </td>
          </tr>`;
      }
    }

    function openFileUrl(id) {
      window.location.href = `${window.location.origin}${window.location.pathname}?id=${id}`;
    }

    // ฟังก์ชันลบไฟล์ (เฉพาะแอดมิน)
    async function deleteFile(fileId, fileName) {
      if (!adminAuth) return;

      const confirmResult = await Swal.fire({
        title: 'ยืนยันการลบไฟล์?',
        text: `คุณต้องการลบไฟล์ "${fileName}" ใช่หรือไม่?`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#EF4444',
        cancelButtonColor: '#64748B',
        confirmButtonText: 'ใช่, ลบไฟล์',
        cancelButtonText: 'ยกเลิก',
        customClass: { popup: 'rounded-2xl' }
      });

      if (confirmResult.isConfirmed) {
        Swal.fire({
          title: 'กำลังลบไฟล์...',
          allowOutsideClick: false,
          customClass: { popup: 'rounded-2xl' },
          didOpen: () => Swal.showLoading()
        });

        try {
          const response = await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'deleteFile',
              fileId: fileId,
              username: adminAuth.username,
              password: adminAuth.password
            })
          });

          const result = await response.json();

          if (result.status === 'success') {
            Swal.fire({
              icon: 'success',
              title: 'ลบไฟล์สำเร็จ',
              timer: 1500,
              showConfirmButton: false,
              customClass: { popup: 'rounded-2xl' }
            });
            loadFilesList();
          } else {
            Swal.fire({
              icon: 'error',
              title: 'ลบไฟล์ไม่สำเร็จ',
              text: result.message,
              customClass: { popup: 'rounded-2xl' }
            });
          }
        } catch (err) {
          Swal.fire({
            icon: 'error',
            title: 'เกิดข้อผิดพลาด',
            text: 'ไม่สามารถเชื่อมต่อเพื่อลบไฟล์ได้',
            customClass: { popup: 'rounded-2xl' }
          });
        }
      }
    }

    async function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.type !== 'application/pdf') {
        Swal.fire({
          icon: 'error',
          title: 'รูปแบบไฟล์ไม่ถูกต้อง',
          text: 'กรุณาเลือกเฉพาะไฟล์ PDF เท่านั้น',
          customClass: { popup: 'rounded-2xl' }
        });
        return;
      }

      const reader = new FileReader();
      reader.onload = async function(e) {
        const base64Data = e.target.result;
        uploadFileProcess(file.name, base64Data, false);
      };
      reader.readAsDataURL(file);
      
      event.target.value = '';
    }

    async function uploadFileProcess(fileName, base64Data, forceUpdate) {
      Swal.fire({
        title: 'กำลังอัปโหลด...',
        text: 'กรุณารอสักครู่ ระบบกำลังจัดเก็บไฟล์ของคุณ',
        allowOutsideClick: false,
        customClass: { popup: 'rounded-2xl' },
        didOpen: () => Swal.showLoading()
      });

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'upload',
            fileName: fileName,
            base64Data: base64Data,
            forceUpdate: forceUpdate
          })
        });

        const result = await response.json();

        if (result.status === 'exists') {
          const confirmResult = await Swal.fire({
            title: 'พบไฟล์ชื่อซ้ำ!',
            text: `ไฟล์ "${fileName}" มีอยู่ในระบบแล้ว คุณต้องการอัปเดตเวอร์ชันใหม่หรือไม่? (ไฟล์เดิมจะถูกลบออก)`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#4F46E5',
            cancelButtonColor: '#64748B',
            confirmButtonText: 'ใช่, อัปเดตเวอร์ชัน',
            cancelButtonText: 'ยกเลิก',
            customClass: { popup: 'rounded-2xl' }
          });

          if (confirmResult.isConfirmed) {
            uploadFileProcess(fileName, base64Data, true);
          }
        } else if (result.status === 'success') {
          Swal.fire({
            icon: 'success',
            title: 'อัปโหลดสำเร็จ!',
            text: 'ไฟล์ของคุณถูกบันทึกเรียบร้อยแล้ว',
            timer: 2000,
            showConfirmButton: false,
            customClass: { popup: 'rounded-2xl' }
          });
          loadFilesList();
        } else {
          throw new Error(result.message);
        }
      } catch (err) {
        Swal.fire({
          icon: 'error',
          title: 'เกิดข้อผิดพลาด',
          text: err.message || 'ไม่สามารถอัปโหลดไฟล์ได้',
          customClass: { popup: 'rounded-2xl' }
        });
      }
    }
  </script>
</body>
</html>
