  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>

<body class="min-h-screen text-slate-700 m-0 p-0 overflow-x-hidden selection:bg-pink-200 selection:text-pink-900">

      <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
        
        <!-- Logo / Title -->

        <!-- Desktop Navigation Items -->

          <!-- Dynamic Links -->
        </nav>

        <!-- Mobile Hamburger Button -->

        <!-- Dynamic Mobile Links -->
      </div>
    </div>

    <!-- Loading Screen -->

      <div class="w-12 h-12 rounded-full border-4 border-pink-400 border-t-transparent animate-spin mb-4"></div>
      <p class="text-slate-300 font-heading font-medium text-sm">กำลังโหลดและสแกนโครงสร้างเอกสาร...</p>
    </div>

    <!-- Canvas Container สำหรับวางหน้า PDF ต่อเนื่อง -->
    <div id="pagesCanvasContainer" class="w-full max-w-4xl mx-auto my-6 shadow-2xl rounded-2xl overflow-hidden bg-white"></div>

  <!-- Main App View -->

    <!-- Top Bar Navigation (Admin Status) -->
    <div class="flex justify-between items-center mb-6">
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/70 backdrop-blur-md border border-pink-100 shadow-sm text-xs font-medium text-pink-600">
        <i class="fa-solid fa-sparkles text-pink-400"></i>

      <div id="adminNav">

          <i class="fa-solid fa-user-gear text-slate-400"></i>
          เข้าสู่ระบบแอดมิน
        </button>
      </div>
    </div>

    <!-- Header & Upload Card -->
    <div class="bg-white/80 backdrop-blur-xl rounded-3xl border border-white/80 shadow-xl shadow-purple-900/5 p-6 sm:p-8 mb-8">
      <div class="flex flex-col sm:flex-row justify-between items-center gap-6">
        <div class="flex items-center gap-4 text-center sm:text-left">
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-pink-500 to-purple-600 text-white flex items-center justify-center shadow-lg shadow-pink-500/25 shrink-0">
            <i class="fa-solid fa-folder-heart text-2xl"></i>
          </div>
          <div>
            <h1 class="text-2xl sm:text-3xl font-bold font-heading text-slate-800 tracking-tight">
              My Portfolio <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-600">Storage</span>
            </h1>
            <p class="text-slate-400 text-xs sm:text-sm mt-1">คลังเก็บและจัดแสดงผลงาน Portfolio (.pdf) ฉบับมินิมอล</p>
          </div>
        </div>
        
        <div class="w-full sm:w-auto">
          <input type="file" id="fileInput" accept="application/pdf" class="hidden" onchange="handleFileSelect(event)">
          <button onclick="document.getElementById('fileInput').click()" class="w-full sm:w-auto bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white px-7 py-3.5 rounded-2xl shadow-lg shadow-pink-500/25 hover:shadow-pink-500/35 transition-all duration-200 font-heading font-medium text-sm flex items-center justify-center gap-2 transform active:scale-95">
            <i class="fa-solid fa-cloud-arrow-up text-base"></i>
            อัปโหลด Portfolio (.pdf)
          </button>
        </div>
      </div>
    </div>

    <!-- Content Table Container -->
    <div class="bg-white/80 backdrop-blur-xl rounded-3xl border border-white/80 shadow-xl shadow-purple-900/5 overflow-hidden">
      <div class="p-5 sm:p-6 border-b border-slate-100/80 flex justify-between items-center">
        <h2 class="text-base font-bold font-heading text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-list-check text-pink-400"></i> รายการผลงานทั้งหมด
        </h2>
        <button onclick="loadFilesList()" class="text-pink-500 hover:text-pink-600 bg-pink-50 hover:bg-pink-100/80 px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center gap-1.5">
          <i class="fa-solid fa-rotate-right"></i> รีเฟรช
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50/50 border-b border-slate-100/80 text-slate-400 text-xs font-heading">
              <th class="py-3.5 px-6 font-medium">ชื่อไฟล์ Portfolio</th>
              <th class="py-3.5 px-6 font-medium">ขนาด</th>
              <th class="py-3.5 px-6 font-medium">วันที่อัปโหลด</th>
              <th class="py-3.5 px-6 font-medium text-center">จัดการ</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100/60 text-sm">
            <tr>
              <td colspan="4" class="text-center py-12 text-slate-400">
                <div class="inline-block p-4 rounded-full bg-pink-50 text-pink-400 mb-3 animate-pulse">
                  <i class="fa-solid fa-sparkles text-2xl"></i>
                </div>
                <p class="font-medium text-slate-500 text-xs">กำลังโหลดข้อมูลผลงาน...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwg0vi1g8Ke6CvRjd2CoAOoIeCUsgr_h8w4dlMeMexi7ZqrP2wJMDq9VAJeK1_hOpFo/exec";

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let adminAuth = JSON.parse(sessionStorage.getItem('adminAuth')) || null;

    window.onload = function() {
      updateAdminUI();
      const urlParams = new URLSearchParams(window.location.search);
      const fileName = urlParams.get('file') || urlParams.get('name') || urlParams.get('id');

      if (fileName) {
        renderWebsiteMode(decodeURIComponent(fileName));
      } else {
        loadFilesList();
      }
    };

    function toggleMobileMenu() {
      const menu = document.getElementById('mobileMenuNav');
      if (menu) menu.classList.toggle('hidden');
    }

    function updateAdminUI() {
      const adminNav = document.getElementById('adminNav');
      if (adminAuth) {
        adminNav.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="bg-emerald-50 text-emerald-700 border border-emerald-200/60 text-xs px-3 py-1.5 rounded-2xl font-medium flex items-center gap-1.5">
              <i class="fa-solid fa-circle-check text-emerald-500"></i> ${adminAuth.username}
            </span>
            <button onclick="logoutAdmin()" class="bg-rose-50 hover:bg-rose-100 text-rose-500 px-3 py-1.5 rounded-2xl text-xs font-medium transition flex items-center gap-1">
              <i class="fa-solid fa-right-from-bracket"></i> ออก
            </button>
          </div>
        `;
      } else {
        adminNav.innerHTML = `
          <button onclick="openAdminLoginModal()" class="bg-white/80 hover:bg-white text-slate-600 border border-slate-200/80 shadow-sm px-4 py-2 rounded-2xl text-xs font-medium transition flex items-center gap-2 backdrop-blur-md">
            <i class="fa-solid fa-user-gear text-slate-400"></i>
            เข้าสู่ระบบแอดมิน
          </button>
        `;
      }
    }

    // ฟังก์ชันช่วยรวมตัวอักษรและสระภาษาไทยที่หลุดเว้นวรรค
    function fixThaiSpacing(str) {
      if (!str) return '';
      let cleaned = str.trim();
      for (let i = 0; i < 3; i++) {
        cleaned = cleaned.replace(/([ก-๙])\s+(?=[ก-๙])/g, '$1');
      }
      return cleaned.replace(/\s+/g, ' ');
    }

    // ฟังก์ชันดึง Text บน PDF จากพิกัด Rect ของปุ่มลิงก์ (แก้ไขกรอบพิกัดไม่ให้กินบรรทัดอื่น)
    async function getLinkTextInRect(page, rect) {
      try {
        if (!rect || rect.length < 4) return '';
        const textContent = await page.getTextContent();
        
        // กำหนดพิกัดค้นหาให้แม่นยำตรงกับปุ่มจริง (ไม่ขยายขอบเขตขึ้นบรรทัดใหม่)
        const lX1 = Math.min(rect[0], rect[2]) - 5;
        const lX2 = Math.max(rect[0], rect[2]) + 5;
        const lY1 = Math.min(rect[1], rect[3]) - 3;
        const lY2 = Math.max(rect[1], rect[3]) + 3;

        const matchedItems = textContent.items.filter(item => {
          if (!item.str || !item.str.trim()) return false;
          const x = item.transform[4];
          const y = item.transform[5]; // Baseline Y ใน PDF
          return x >= lX1 && x <= lX2 && y >= lY1 && y <= lY2;
        });

        if (matchedItems.length === 0) return '';

        // เรียงลำดับตัวอักษรจากบนลงล่าง และจากซ้ายไปขวา
        matchedItems.sort((a, b) => {
          const yDiff = b.transform[5] - a.transform[5];
          if (Math.abs(yDiff) > 3) return yDiff;
          return a.transform[4] - b.transform[4];
        });

        const rawText = matchedItems.map(i => i.str).join(' ');
        let cleaned = fixThaiSpacing(rawText);
        
        // ตัดตัวเลขหัวข้อข้างหน้าออก เช่น "01 คำนำ" -> เหลือเฉพาะ "คำนำ"
        const cleanWithoutNum = cleaned.replace(/^[\d\s.\-•]+/, '').trim();
        if (cleanWithoutNum.length > 0) {
          cleaned = cleanWithoutNum;
        }

        return cleaned;
      } catch (e) {
        return '';
      }
    }

    // ฟังก์ชันสแกนเฉพาะพื้นที่ที่เป็นลิงก์กดได้จริง
    async function extractLinksFromPdf(pdf) {
      const targetMap = new Map();

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        try {
          const page = await pdf.getPage(pageNum);
          const annotations = await page.getAnnotations();

          for (const annot of annotations) {
            if (annot.subtype === 'Link' || annot.annotationType === 2) {
              
              if (annot.url) {
                // ลิงก์ภายนอก (External Link)
                const url = annot.url.trim();
                const key = `ext_${url}`;

                if (!targetMap.has(key)) {
                  let cleanText = await getLinkTextInRect(page, annot.rect);
                  let title = cleanText;
                  let icon = 'fa-arrow-up-right-from-square';

                  if (url.startsWith('mailto:')) {
                    icon = 'fa-envelope';
                    if (!title) title = url.replace('mailto:', '');
                  } else if (!title) {
                    try {
                      const parsed = new URL(url);
                      title = parsed.hostname.replace('www.', '');
                    } catch(e) { 
                      title = url; 
                    }
                  }

                  targetMap.set(key, {
                    title: title,
                    target: url,
                    type: 'external',
                    icon: icon,
                    pageNum: pageNum
                  });
                }
              } else if (annot.dest) {
                // ลิงก์ภายในหน้า (Internal Page Link)
                let targetPage = null;
                if (typeof annot.dest === 'string') {
                  try {
                    const destArray = await pdf.getDestination(annot.dest);
                    if (destArray) targetPage = (await pdf.getPageIndex(destArray[0])) + 1;
                  } catch(e) {}
                } else if (Array.isArray(annot.dest)) {
                  try {
                    targetPage = (await pdf.getPageIndex(annot.dest[0])) + 1;
                  } catch(e) {}
                }

                if (targetPage) {
                  const key = `int_${targetPage}`;
                  let cleanText = await getLinkTextInRect(page, annot.rect);

                  if (!targetMap.has(key)) {
                    targetMap.set(key, {
                      title: (cleanText && cleanText.length > 0) ? cleanText : `หน้า ${targetPage}`,
                      target: targetPage,
                      type: 'internal',
                      icon: 'fa-bookmark'
                    });
                  } else {
                    const existing = targetMap.get(key);
                    // ถ้าก่อนหน้านี้เป็นชื่อหน้า ให้แทนที่ด้วยข้อความจริงที่ดึงได้
                    if (existing.title.startsWith('หน้า ') && cleanText) {
                      existing.title = cleanText;
                    }
                  }
                }
              }
            }
          }
        } catch(e) {
          console.warn(`Error scanning page ${pageNum}:`, e);
        }
      }

      const extractedLinks = Array.from(targetMap.values());

      // จัดเรียงลำดับปุ่มเรียงตามเลขหน้าเป้าหมาย (1 -> 2 -> 3 ...)
      extractedLinks.sort((a, b) => {
        if (a.type === 'internal' && b.type === 'internal') {
          return a.target - b.target;
        }
        if (a.type === 'internal') return -1;
        if (b.type === 'internal') return 1;
        return (a.pageNum || 0) - (b.pageNum || 0);
      });

      return extractedLinks;
    }

    // ฟังก์ชันสร้างเมนูบน Navigation Bar
    function buildPdfLinksNavbar(links) {
      const headerBar = document.getElementById('viewerHeaderBar');
      const desktopNav = document.getElementById('desktopMenuNav');
      const mobileNav = document.getElementById('mobileMenuNav');

      if (!links || links.length === 0) {
        headerBar.classList.add('hidden');
        return;
      }

      headerBar.classList.remove('hidden');

      const desktopHtml = links.map((link) => {
        const actionScript = link.type === 'external' 
          ? `window.open('${link.target}', '_blank')` 
          : `scrollToPdfPage(${link.target})`;

        return `
          <button onclick="${actionScript}" class="px-3 py-1.5 rounded-xl text-xs font-heading font-medium text-slate-300 hover:text-white hover:bg-slate-800/90 transition flex items-center gap-1.5 whitespace-nowrap border border-slate-700/40">
            <i class="fa-solid ${link.icon} text-pink-400 text-[11px]"></i>
            <span>${link.title}</span>
          </button>
        `;
      }).join('');

      const mobileHtml = links.map((link) => {
        const actionScript = link.type === 'external' 
          ? `window.open('${link.target}', '_blank'); toggleMobileMenu();` 
          : `scrollToPdfPage(${link.target}); toggleMobileMenu();`;

        return `
          <button onclick="${actionScript}" class="w-full text-left px-3 py-2 rounded-xl text-xs font-heading font-medium text-slate-300 hover:text-white hover:bg-slate-800/90 transition flex items-center gap-2">
            <i class="fa-solid ${link.icon} text-pink-400 text-[11px]"></i>
            <span>${link.title}</span>
          </button>
        `;
      }).join('');

      desktopNav.innerHTML = desktopHtml;
      mobileNav.innerHTML = mobileHtml;
    }

    // Smooth Scroll ไปยังหน้า PDF ที่เลือก
    function scrollToPdfPage(pageNum) {
      const pageCanvas = document.getElementById(`pdf-page-${pageNum}`);
      if (pageCanvas) {
        pageCanvas.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    async function renderWebsiteMode(fileName) {
      document.getElementById('mainContainer').classList.add('hidden');
      const webContainer = document.getElementById('websiteViewerContainer');
      const loadingView = document.getElementById('loadingView');
      const pagesContainer = document.getElementById('pagesCanvasContainer');
      const docTitle = document.getElementById('pdfDocumentTitle');

      webContainer.classList.remove('hidden');
      docTitle.textContent = fileName;

      try {
        const response = await fetch(`${GAS_WEB_APP_URL}?action=getFile&name=${encodeURIComponent(fileName)}`);
        const result = await response.json();

        if (result.status === 'success' && result.base64) {
          const pdfData = atob(result.base64);
          const pdfArray = new Uint8Array(pdfData.length);
          for (let i = 0; i < pdfData.length; i++) {
            pdfArray[i] = pdfData.charCodeAt(i);
          }

          const pdf = await pdfjsLib.getDocument({ data: pdfArray }).promise;
          
          const extractedLinks = await extractLinksFromPdf(pdf);
          buildPdfLinksNavbar(extractedLinks);

          loadingView.classList.add('hidden');
          pagesContainer.innerHTML = '';

          for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            
            const viewport = page.getViewport({ scale: 2 });
            const canvas = document.createElement('canvas');
            canvas.id = `pdf-page-${pageNum}`;
            const context = canvas.getContext('2d');
            
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            pagesContainer.appendChild(canvas);

            await page.render({
              canvasContext: context,
              viewport: viewport
            }).promise;
          }
        } else {
          showErrorScreen(result.message || 'ไม่พบไฟล์ในระบบ');
        }
      } catch (err) {
        showErrorScreen('เกิดข้อผิดพลาดในการดึงข้อมูลผลงาน');
      }
    }

    function showErrorScreen(message) {
      document.body.innerHTML = `
        <div class="flex items-center justify-center min-h-screen bg-slate-900 p-4">
          <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl">
            <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center text-2xl">
              <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h2 class="text-lg font-bold font-heading text-slate-800 mb-2">ไม่สามารถแสดงผลได้</h2>
            <p class="text-slate-400 text-xs mb-6">${message}</p>
            <button onclick="window.location.href = window.location.pathname" class="bg-pink-500 hover:bg-pink-600 text-white px-6 py-2.5 rounded-2xl font-medium text-xs transition shadow-md shadow-pink-500/20">
              หน้าหลัก
            </button>
          </div>
        </div>
      `;
    }

    async function loadFilesList() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = `
        <tr>
          <td colspan="4" class="text-center py-12 text-slate-400">
            <div class="inline-block p-4 rounded-full bg-pink-50 text-pink-400 mb-3 animate-pulse">
              <i class="fa-solid fa-sparkles text-2xl"></i>
            </div>
            <p class="font-medium text-slate-500 text-xs">กำลังโหลดข้อมูลผลงาน...</p>
          </td>
        </tr>`;

      try {
        const response = await fetch(`${GAS_WEB_APP_URL}?action=getFiles`);
        const result = await response.json();

        if (result.status === 'success' && result.data.length > 0) {
          tbody.innerHTML = result.data.map(file => {
            const encodedName = encodeURIComponent(file.name);
            const deleteBtnHtml = adminAuth ? `
              <button onclick="deleteFile('${file.id}', '${file.name.replace(/'/g, "\\'")}')" class="bg-rose-50 hover:bg-rose-100 text-rose-500 px-3 py-1.5 rounded-xl text-xs font-medium transition inline-flex items-center gap-1">
                <i class="fa-solid fa-trash-can text-xs"></i> ลบ
              </button>
            ` : '';

            return `
              <tr class="hover:bg-pink-50/40 transition-colors group">
                <td class="py-4 px-6 font-medium text-slate-700 group-hover:text-pink-600 transition-colors cursor-pointer" onclick="openFileUrl('${encodedName}')">
                  <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-pink-100/70 text-pink-500 flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
                      <i class="fa-solid fa-file-pdf"></i>
                    </div>
                    <span class="truncate max-w-xs sm:max-w-md font-heading font-medium text-sm text-slate-800">${file.name}</span>
                  </div>
                </td>
                <td class="py-4 px-6 text-slate-400 text-xs">${file.size}</td>
                <td class="py-4 px-6 text-slate-400 text-xs">
                  <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-slate-100/80 text-slate-500 font-medium text-[11px]">
                    <i class="fa-regular fa-clock text-[10px]"></i> ${file.date}
                  </span>
                </td>
                <td class="py-4 px-6 text-center">
                  <div class="flex items-center justify-center gap-1.5">
                    <button onclick="openFileUrl('${encodedName}')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-3 py-1.5 rounded-xl text-xs font-medium transition inline-flex items-center gap-1">
                      <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i> เปิดดู
                    </button>
                    ${deleteBtnHtml}
                  </div>
                </td>
              </tr>
            `;
          }).join('');
        } else {
          tbody.innerHTML = `
            <tr>
              <td colspan="4" class="text-center py-12 text-slate-400">
                <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-purple-50 text-purple-300 flex items-center justify-center text-2xl">
                  <i class="fa-solid fa-folder-open"></i>
                </div>
                <p class="font-heading font-medium text-slate-600 text-sm">ยังไม่มีไฟล์ผลงานในระบบ</p>
                <p class="text-xs text-slate-400 mt-1">กดปุ่ม "อัปโหลด Portfolio" ด้านบนเพื่อเริ่มเพิ่มผลงานได้เลย ✨</p>
              </td>
            </tr>`;
        }
      } catch (err) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="text-center py-12 text-rose-500">
              <div class="w-12 h-12 mx-auto mb-2 rounded-full bg-rose-50 text-rose-400 flex items-center justify-center text-xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
              </div>
              <p class="font-medium text-xs">เกิดข้อผิดพลาดในการโหลดข้อมูล</p>
            </td>
          </tr>`;
      }
    }

    function openFileUrl(encodedFileName) {
      const fileUrl = `${window.location.origin}${window.location.pathname}?file=${encodedFileName}`;
      window.open(fileUrl, '_blank');
    }

    async function openAdminLoginModal() {
      const { value: formValues } = await Swal.fire({
        title: '<span class="font-heading text-lg text-slate-800">เข้าสู่ระบบแอดมิน</span>',
        html: `
          <div class="text-left mt-3 space-y-3 font-sans">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Username</label>
              <input id="swal-input-user" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-pink-400 text-sm" placeholder="ระบุ Username">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Password</label>
              <input id="swal-input-pass" type="password" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-pink-400 text-sm" placeholder="ระบุ Password">
            </div>
          </div>
        `,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'เข้าสู่ระบบ',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#EC4899',
        customClass: { popup: 'rounded-3xl' },
        preConfirm: () => {
          const username = document.getElementById('swal-input-user').value;
          const password = document.getElementById('swal-input-pass').value;
          if (!username || !password) {
            Swal.showValidationMessage('กรุณากรอกข้อมูลให้ครบถ้วน');
            return false;
          }
          return { username, password };
        }
      });

      if (formValues) {
        Swal.fire({
          title: 'กำลังตรวจสอบ...',
          allowOutsideClick: false,
          customClass: { popup: 'rounded-3xl' },
          didOpen: () => Swal.showLoading()
        });

        try {
          const response = await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'loginAdmin',
              username: formValues.username,
              password: formValues.password
            })
          });

          const result = await response.json();

          if (result.status === 'success') {
            adminAuth = { username: formValues.username, password: formValues.password };
            sessionStorage.setItem('adminAuth', JSON.stringify(adminAuth));
            updateAdminUI();
            
            Swal.fire({
              icon: 'success',
              title: 'เข้าสู่ระบบสำเร็จ',
              text: 'ยินดีต้อนรับเข้าสู่ระบบจัดการแอดมิน',
              timer: 1500,
              showConfirmButton: false,
              customClass: { popup: 'rounded-3xl' }
            });

            loadFilesList();
          } else {
            Swal.fire({
              icon: 'error',
              title: 'เข้าสู่ระบบไม่สำเร็จ',
              text: result.message,
              customClass: { popup: 'rounded-3xl' }
            });
          }
        } catch (err) {
          Swal.fire({
            icon: 'error',
            title: 'เกิดข้อผิดพลาด',
            text: 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้',
            customClass: { popup: 'rounded-3xl' }
          });
        }
      }
    }

    function logoutAdmin() {
      adminAuth = null;
      sessionStorage.removeItem('adminAuth');
      updateAdminUI();
      Swal.fire({
        icon: 'info',
        title: 'ออกจากระบบแล้ว',
        timer: 1500,
        showConfirmButton: false,
        customClass: { popup: 'rounded-3xl' }
      });
      loadFilesList();
    }

    async function deleteFile(fileId, fileName) {
      if (!adminAuth) return;

      const confirmResult = await Swal.fire({
        title: '<span class="font-heading text-lg">ยืนยันการลบไฟล์?</span>',
        text: `คุณต้องการลบไฟล์ "${fileName}" ใช่หรือไม่?`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#EF4444',
        cancelButtonColor: '#94A3B8',
        confirmButtonText: 'ใช่, ลบไฟล์',
        cancelButtonText: 'ยกเลิก',
        customClass: { popup: 'rounded-3xl' }
      });

      if (confirmResult.isConfirmed) {
        Swal.fire({
          title: 'กำลังลบไฟล์...',
          allowOutsideClick: false,
          customClass: { popup: 'rounded-3xl' },
          didOpen: () => Swal.showLoading()
        });

        try {
          const response = await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'deleteFile',
              fileId: fileId,
              username: adminAuth.username,
              password: adminAuth.password
            })
          });

          const result = await response.json();

          if (result.status === 'success') {
            Swal.fire({
              icon: 'success',
              title: 'ลบไฟล์สำเร็จ',
              timer: 1500,
              showConfirmButton: false,
              customClass: { popup: 'rounded-3xl' }
            });
            loadFilesList();
          } else {
            Swal.fire({
              icon: 'error',
              title: 'ลบไฟล์ไม่สำเร็จ',
              text: result.message,
              customClass: { popup: 'rounded-3xl' }
            });
          }
        } catch (err) {
          Swal.fire({
            icon: 'error',
            title: 'เกิดข้อผิดพลาด',
            text: 'ไม่สามารถเชื่อมต่อเพื่อลบไฟล์ได้',
            customClass: { popup: 'rounded-3xl' }
          });
        }
      }
    }

    async function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.type !== 'application/pdf') {
        Swal.fire({
          icon: 'error',
          title: 'รูปแบบไฟล์ไม่ถูกต้อง',
          text: 'กรุณาเลือกเฉพาะไฟล์ PDF เท่านั้น',
          customClass: { popup: 'rounded-3xl' }
        });
        return;
      }

      const reader = new FileReader();
      reader.onload = async function(e) {
        const base64Data = e.target.result;
        uploadFileProcess(file.name, base64Data, false);
      };
      reader.readAsDataURL(file);
      
      event.target.value = '';
    }

    async function uploadFileProcess(fileName, base64Data, forceUpdate) {
      Swal.fire({
        title: 'กำลังอัปโหลด...',
        text: 'กรุณารอสักครู่ ระบบกำลังจัดเก็บไฟล์ของคุณ',
        allowOutsideClick: false,
        customClass: { popup: 'rounded-3xl' },
        didOpen: () => Swal.showLoading()
      });

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'upload',
            fileName: fileName,
            base64Data: base64Data,
            forceUpdate: forceUpdate
          })
        });

        const result = await response.json();

        if (result.status === 'exists') {
          const confirmResult = await Swal.fire({
            title: '<span class="font-heading text-lg">พบไฟล์ชื่อซ้ำ!</span>',
            text: `ไฟล์ "${fileName}" มีอยู่ในระบบแล้ว คุณต้องการอัปเดตเวอร์ชันใหม่หรือไม่?`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#EC4899',
            cancelButtonColor: '#94A3B8',
            confirmButtonText: 'ใช่, อัปเดตเวอร์ชัน',
            cancelButtonText: 'ยกเลิก',
            customClass: { popup: 'rounded-3xl' }
          });

          if (confirmResult.isConfirmed) {
            uploadFileProcess(fileName, base64Data, true);
          }
        } else if (result.status === 'success') {
          Swal.fire({
            icon: 'success',
            title: 'อัปโหลดสำเร็จ!',
            text: 'ไฟล์ผลงานของคุณถูกจัดเก็บเรียบร้อยแล้ว ✨',
            timer: 2000,
            showConfirmButton: false,
            customClass: { popup: 'rounded-3xl' }
          });
          loadFilesList();
        } else {
          throw new Error(result.message);
        }
      } catch (err) {
        Swal.fire({
          icon: 'error',
          title: 'เกิดข้อผิดพลาด',
          text: err.message || 'ไม่สามารถอัปโหลดไฟล์ได้',
          customClass: { popup: 'rounded-3xl' }
        });
      }
    }
  </script>
